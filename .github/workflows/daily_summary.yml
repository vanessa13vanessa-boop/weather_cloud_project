name: Daily Observed Summary

on:
  schedule:
    - cron: "30 6 * * *"   # 00:30 MDT (06:30 UTC)
  workflow_dispatch:

jobs:
  compute-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        uses: dopplerhq/cli-action@v1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          command: doppler run --config gcp_personal -- python weather_observed_summary_daily.py
